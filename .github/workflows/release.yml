name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@v0.11.38
        with:
          install: 'false'

      - name: Install Dependencies
        run: bun install

      - name: Build and verify package
        run: |
          bun run build
          bun --cwd packages/ts-maps run check:package

      - name: Publish
        working-directory: packages/ts-maps
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
