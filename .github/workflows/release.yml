name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@main
        with:
          install: 'false'

      - name: Install Dependencies
        run: bun install

      - name: Build and verify package
        run: |
          bun run build
          bun --cwd packages/ts-maps run check:package

      # ts-maps, then every framework binding. A version already on npm is
      # skipped, so running this by hand on main publishes what a release
      # left out.
      - name: Publish
        run: bun scripts/publish-packages.ts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: stacksjs/action-releaser@v1.2.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
