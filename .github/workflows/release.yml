name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@main
        with:
          install: 'false'

      - name: Install Dependencies
        run: bun install

      - name: Build and verify package
        run: |
          bun run build
          bun --cwd packages/ts-maps run check:package

      # From the root, pantry publishes every package in packages/: ts-maps
      # first, each binding after what it installs, `workspace:*` pinned to
      # the release's version. A version already on npm is skipped, so a run
      # by hand on main publishes whatever a release left out. Built above,
      # so no package builds itself again.
      - name: Publish
        run: pantry publish --npm --access public --ignore-scripts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: stacksjs/action-releaser@v1.2.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
