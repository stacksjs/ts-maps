<!doctype html>
<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' />
    <title>ts-maps — 16. Landmarks and trees</title>
    <link rel='stylesheet' href='../../packages/ts-maps/src/core-map/ts-maps.css' />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      #map { position: absolute; inset: 0; }
      .places { position: absolute; left: 12px; top: 12px; z-index: 800; display: flex; gap: 6px; }
      .places button { font: 600 13px -apple-system, system-ui, sans-serif; padding: 7px 12px; border: 0; border-radius: 9px; background: rgba(255, 255, 255, 0.92); color: #1c1c1e; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2); cursor: pointer; }
    </style>
  </head>
  <body>
    <div id='map'></div>
    <div class='places'>
      <button type='button' data-place='downtown'>Transamerica Pyramid</button>
      <button type='button' data-place='presidio'>Presidio woods</button>
    </div>
    <script type='module' src='./16-landmarks.ts'></script>
  </body>
</html>
