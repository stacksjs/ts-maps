<!doctype html>
<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' />
    <title>Camera — ts-maps playground</title>
    <meta name='description' content="Turn and tilt the map with the sliders, or move the camera between cities: flyTo arcs out and back in, easeTo glides." />
    <link rel='stylesheet' href='../../packages/ts-maps/src/core-map/ts-maps.css' />
    <link rel='stylesheet' href='./shared.css' />
    <style>
      .pin {
        width: 26px;
        height: 26px;
        border-radius: 50% 50% 50% 0;
        background: #2f6fed;
        border: 2px solid #ffffff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        transform: rotate(-45deg);
      }
      .pin::after {
        content: '';
        display: block;
        width: 8px;
        height: 8px;
        margin: 6px 0 0 6px;
        border-radius: 50%;
        background: #ffffff;
      }
      .control-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
      }
      .control-row label {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
      }
      .value-badge {
        font-family: var(--mono);
        color: var(--accent);
      }
      .camera-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
    </style>
  </head>
  <body class='demo'>
  <div id='map'></div>
  <div class='demo-panel'>
    <h2>Camera</h2>
    <div class='control-row'>
      <label for='bearing'><span>Bearing</span><span id='bearing-value' class='value-badge'>0°</span></label>
      <input id='bearing' type='range' min='0' max='359' step='1' value='0' />
    </div>
    <div class='control-row'>
      <label for='pitch'><span>Pitch</span><span id='pitch-value' class='value-badge'>0°</span></label>
      <input id='pitch' type='range' min='0' max='60' step='1' value='0' />
    </div>
    <div class='camera-buttons'>
      <button id='fly-nyc' type='button'>Fly to NYC</button>
      <button id='ease-tokyo' type='button'>Ease to Tokyo</button>
      <button id='reset-camera' type='button' class='secondary'>Reset</button>
    </div>
  </div>
  <details class='demo-info' open>
    <summary>Camera</summary>
    <div class='demo-body'>
      <p>Turn and tilt the map with the sliders, or move the camera between cities: <code>flyTo</code> arcs out and back in, <code>easeTo</code> glides.</p>
      <nav class='demo-links'>
        <a href='./index.html'>All demos</a>
        <a href='https://github.com/stacksjs/ts-maps/blob/main/playground/core-map/1-camera.ts' target='_blank' rel='noopener'>Source</a>
      </nav>
    </div>
  </details>
  <script type='module' src='./1-camera.ts'></script>
  </body>
</html>
