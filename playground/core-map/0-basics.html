<!doctype html>
<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' />
    <title>Basics — ts-maps playground</title>
    <meta name='description' content="The vector basemap with a draggable marker at Times Square and its popup. Pan, zoom, pinch and drag; zoom is fractional, so a slow scroll glides between levels." />
    <link rel='stylesheet' href='../../packages/ts-maps/src/core-map/ts-maps.css' />
    <link rel='stylesheet' href='./shared.css' />
    <style>
      .pin {
        width: 26px;
        height: 26px;
        border-radius: 50% 50% 50% 0;
        background: #2f6fed;
        border: 2px solid #ffffff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        transform: rotate(-45deg);
      }
      .pin::after {
        content: '';
        display: block;
        width: 8px;
        height: 8px;
        margin: 6px 0 0 6px;
        border-radius: 50%;
        background: #ffffff;
      }
    </style>
  </head>
  <body class='demo'>
  <div id='map'></div>
  <details class='demo-info' open>
    <summary>Basics</summary>
    <div class='demo-body'>
      <p>The vector basemap with a draggable marker at Times Square and its popup. Pan, zoom, pinch and drag; zoom is fractional, so a slow scroll glides between levels.</p>
      <nav class='demo-links'>
        <a href='./index.html'>All demos</a>
        <a href='https://github.com/stacksjs/ts-maps/blob/main/playground/core-map/0-basics.ts' target='_blank' rel='noopener'>Source</a>

    </div>
